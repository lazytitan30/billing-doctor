name: Something is broken
description: A crash, a wrong exit code, a command that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security problems.** If it leaks a token, a key or user data,
        read SECURITY.md and report it privately instead.
  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
  - type: input
    id: env
    attributes:
      label: Version, operating system and Node version
