# Publish to npm, from here rather than from somebody's laptop.
#
# Why this exists rather than `npm publish` on a desktop:
#
#   Provenance. npm records a signed, publicly logged statement linking the
#   published package to the commit and the workflow that built it. Anyone can
#   then check that what they installed came from this repository and not from
#   whoever compromised a laptop. For a tool people point at their billing logs
#   that is worth the setup.
#
#   Repeatability. A laptop publish depends on what happens to be in that
#   folder. This starts from a clean checkout every time.
#
# Authentication: trusted publishing, and nothing else. npm hands this workflow
# a short-lived token over OIDC, tied to this repository and this file, that
# cannot be extracted or replayed. There is no secret in GitHub to leak, which
# is the point. Configure it once at npmjs.com, Packages, billing-doctor,
# Settings, Trusted Publisher: GitHub Actions, user lazytitan30, repository
# billing-doctor, workflow filename release.yml, environment left blank. It
# can only be set up after the package exists, so 0.1.0 was published by hand.
#
# An NPM_TOKEN secret is not a fallback here any more: npm is restricting
# tokens that bypass two-factor authentication, and a long-lived credential in
# CI is exactly the thing provenance is meant to make unnecessary.
#
# To release: bump the version, update CHANGELOG.md with a date, commit, then
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Everything below has to pass before anything is published, and a publish
# cannot be taken back.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for provenance. It lets the job prove who it is to Sigstore
  # without any long-lived credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The whole gate, again, on the exact commit being published. CI having
      # passed on main is not the same as it passing on this tag.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: node scripts/preflight.mjs
      - run: node scripts/acceptance.mjs
      - run: node scripts/fuzz.mjs ${{ github.run_number }} 2000

      # The tag and package.json must agree. Publishing 0.1.0 from a tag that
      # says v0.2.0 is the kind of thing nobody notices until much later.
      - name: The tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "both say $PKG"

      # Trusted publishing needs npm 11.5.1 or newer (npm's own docs, read
      # 2026-09-13), and the npm bundled with Node 22 is 10.x, so upgrade it
      # first. No token anywhere: the same docs say to omit NODE_AUTH_TOKEN
      # entirely for an OIDC publish, not to leave it empty. The trusted
      # publisher is configured once at npmjs.com, package Settings, Trusted
      # Publisher: lazytitan30 / billing-doctor / release.yml, no environment.
      - run: npm install -g npm@latest && npm --version
      - name: Publish with provenance
        run: npm publish --provenance --access public
