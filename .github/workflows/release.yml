# Publish to npm, from here rather than from somebody's laptop.
#
# Why this exists rather than `npm publish` on a desktop:
#
#   Provenance. npm records a signed, publicly logged statement linking the
#   published package to the commit and the workflow that built it. Anyone can
#   then check that what they installed came from this repository and not from
#   whoever compromised a laptop. For a tool people point at their billing logs
#   that is worth the setup.
#
#   Repeatability. A laptop publish depends on what happens to be in that
#   folder. This starts from a clean checkout every time.
#
# Authentication, in order of preference:
#
#   1. Trusted publishing, which needs no credential at all. npm hands this
#      workflow a short-lived token over OIDC, tied to this repository and this
#      file, that cannot be extracted or replayed. Configure it once at
#      npmjs.com, Packages, billing-doctor, Settings, Trusted publishing, with
#      the owner, the repository, and this filename. It can only be set up
#      after the package exists, so the first release is published by hand.
#
#   2. An NPM_TOKEN secret, if trusted publishing is not set up. Works, but it
#      is a long-lived credential sitting in GitHub, and npm is restricting
#      tokens that bypass two-factor authentication for direct publishing.
#      Prefer option 1 and delete the secret once it is in place.
#
# To release: bump the version, update CHANGELOG.md with a date, commit, then
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Everything below has to pass before anything is published, and a publish
# cannot be taken back.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for provenance. It lets the job prove who it is to Sigstore
  # without any long-lived credential.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The whole gate, again, on the exact commit being published. CI having
      # passed on main is not the same as it passing on this tag.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: node scripts/preflight.mjs
      - run: node scripts/acceptance.mjs
      - run: node scripts/fuzz.mjs ${{ github.run_number }} 2000

      # The tag and package.json must agree. Publishing 0.1.0 from a tag that
      # says v0.2.0 is the kind of thing nobody notices until much later.
      - name: The tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "both say $PKG"

      # No `if` on the token: when trusted publishing is configured npm ignores
      # an empty NODE_AUTH_TOKEN and uses OIDC, and when it is not, the secret
      # is used. Either way the same command publishes with provenance.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
