# Static analysis. Free on public repositories, which this becomes at launch;
# until then it will not run, and that is fine because it costs nothing to have
# waiting. Category 13 of RISK-REGISTER.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds an old bug without a push.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    # Uploading results needs Advanced Security on a private repository, so the
    # analysis runs fine and then fails at the last step. A workflow that is
    # always red teaches people to ignore red, which is worse than not having
    # it, so it waits until the repository is public.
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
